<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login · Admin Irmãos Robaski</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=3">
  <link rel="stylesheet" href="admin.css?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
</head>
<body>

  <div class="login-shell">
    <div class="login-card">
      <img src="../assets/img/logo.png" class="logo" alt="Irmãos Robaski">
      <h1>Painel Administrativo</h1>
      <p class="sub">Acesso restrito · gestão do catálogo</p>

      <form id="login-form" autocomplete="on">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required autofocus>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required minlength="8">

        <button type="submit" class="btn btn-primary" id="btn-entrar">Entrar</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { api, toast } from './admin.js';

    const form = document.getElementById('login-form');
    const btn  = document.getElementById('btn-entrar');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Entrando...';
      try {
        const fd = new FormData(form);
        const data = await api('/api/admin/login', {
          method: 'POST',
          body: { email: fd.get('email'), senha: fd.get('senha') },
        });
        toast('Bem-vindo(a), ' + data.user.nome + '!', 'success');
        const next = new URLSearchParams(location.search).get('next') || '/admin/';
        setTimeout(() => location.href = next, 400);
      } catch (e) {
        toast(e.message || 'Erro ao entrar', 'error');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
